boss:
  spawn-interval: 3600
  auto-spawn-enabled: true

spawn-location:
  world: ""
  x: 0.0
  y: 64.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

bosses:
  level-1:
    name: "&a&lCOMMON ZOMBIE KING"
    type: "ZOMBIE"
    health: 500.0
    damage-mode: "NORMAL" # NORMAL, ARMOR_REDUCED, HEART_DAMAGE, PERCENT_HEALTH
    base-damage: 8.0
    speed: 0.23
    bossbar:
      color: "GREEN"
      style: "SOLID"
    abilities:
      ground-spike:
        enabled: true
        cooldown: 12
        damage: 10.0
        range: 15.0

  level-2:
    name: "&e&lLEGENDARY IRON GOLEM"
    type: "IRON_GOLEM"
    health: 1000.0
    damage-mode: "ARMOR_REDUCED"
    base-damage: 15.0
    speed: 0.28
    bossbar:
      color: "YELLOW"
      style: "NOTCHED_10"
    abilities:
      ground-spike:
        enabled: true
        cooldown: 10
        damage: 12.0
        range: 20.0
      projectile:
        enabled: true
        cooldown: 8
        damage: 14.0
        range: 30.0
      area-attack:
        enabled: true
        cooldown: 15
        damage: 18.0
        range: 10.0

  level-3:
    name: "&c&lMYTHIC MINOTAUR BULL"
    type: "HOGLIN" # Compatible base entity for Minotaur charge mechanics
    health: 1500.0
    damage-mode: "HEART_DAMAGE"
    base-damage: 4.0 # 4 hearts direct damage
    speed: 0.35
    bossbar:
      color: "RED"
      style: "NOTCHED_12"
    rage:
      threshold: 0.30 # 30% HP
      speed-multiplier: 1.3
    abilities:
      ground-spike:
        enabled: true
        cooldown: 8
        damage: 15.0
        range: 25.0
      projectile:
        enabled: true
        cooldown: 6
        damage: 16.0
        range: 35.0
      area-attack:
        enabled: true
        cooldown: 10
        damage: 20.0
        range: 12.0
      charge:
        enabled: true
        cooldown: 14
        damage: 25.0
        range: 25.0

items:
  red-heart:
    material: "RED_DYE"
    name: "&c&lRed Heart"
    lore:
      - "&7Right-click to instantly heal"
      - "&c+4 Hearts of Health!"
    custom-model-data: 1001
    heal-hearts: 4.0

rewards:
  level-1:
    - type: "ITEM"
      item: "red-heart"
      amount: 1
      chance: 30.0
    - type: "COMMAND"
      command: "give %player% diamond 5"
      chance: 70.0
  level-2:
    - type: "ITEM"
      item: "red-heart"
      amount: 2
      chance: 60.0
    - type: "COMMAND"
      command: "give %player% netherite_ingot 2"
      chance: 40.0
  level-3:
    - type: "ITEM"
      item: "red-heart"
      amount: 4
      chance: 100.0
    - type: "COMMAND"
      command: "give %player% netherite_block 1"
      chance: 50.0

region:
  world: ""
  min-x: 0
  min-y: 0
  min-z: 0
  max-x: 0
  max-y: 0
  max-z: 0
